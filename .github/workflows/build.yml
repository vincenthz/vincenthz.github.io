name: Typed Chronicles on GitHub Pages

on: 
 push:
  branches:
   - master

jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout master
      uses: actions/checkout@v6
    - name: Build and deploy
      uses: shalzz/zola-deploy-action@v0.23.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
